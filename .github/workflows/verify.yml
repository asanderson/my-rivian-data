name: Verify offline prototype

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Install locked dependencies and matching WASM CLI
        run: node scripts/setup.mjs
      - name: Build and verify
        run: node scripts/verify.mjs
      - name: Install Chromium for browser smoke test
        if: runner.os == 'Linux'
        run: node ui/node_modules/playwright/cli.js install --with-deps chromium
      - name: Browser smoke test
        if: runner.os == 'Linux'
        run: npm run test:browser --prefix ui
      - name: Upload unsigned prototype executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rivian-local-${{ matrix.os }}-unsigned
          path: |
            target/release/rivian-local
            target/release/rivian-local.exe
          if-no-files-found: error
          retention-days: 7
