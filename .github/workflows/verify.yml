name: Verify My Rivian Data

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            architecture: x64
          - os: windows-2025
            architecture: x64
          - os: macos-15-intel
            architecture: x64
          - os: macos-15
            architecture: arm64
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install pinned NSIS compiler
        if: runner.os == 'Windows'
        run: choco install nsis --version=3.12 -y --no-progress
      - name: Check Windows installer lifecycle before the native build
        if: runner.os == 'Windows'
        env:
          RIVIAN_NATIVE_INSTALLER_TESTS: '1'
        run: node --test scripts/tests/delivery.test.mjs
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Install locked dependencies and matching WASM CLI
        run: node scripts/setup.mjs
      - name: Build and verify
        run: node scripts/verify.mjs
      - name: Install Chromium for browser smoke test
        if: runner.os == 'Linux'
        run: node ui/node_modules/playwright/cli.js install --with-deps chromium
      - name: Browser smoke test
        if: runner.os == 'Linux'
        run: npm run test:browser --prefix ui
      - name: Install Linux native packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm desktop-file-utils
      - name: Package executable, documentation, notices and corresponding source
        run: node scripts/package.mjs
      - name: Check archive integrity and native package lifecycle
        run: node scripts/check-packages.mjs
      - name: Synthetic backend benchmark
        run: node scripts/benchmark.mjs --demo --duration-seconds 10 --concurrency 2
      - name: Upload unsigned application package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: my-rivian-data-${{ runner.os }}-${{ runner.arch }}-unsigned
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
            dist/*.json
            dist/*.SHA256SUMS
            artifacts/benchmarks/**
          if-no-files-found: error
          retention-days: 7
